# Declarations only. Credentials come from the runtime, never from here.
tools: [video-generation, image-generation, ffmpeg, tts]
state: []
writes: [project-assets]   # renders inside the current project, with approval
global_skills: true   # keeps ~/.claude/skills (UI, animation) in hq runs
requires:   # programs it runs: hq install and hq doctor check them (hq deps video --install)
  ffmpeg: brew install ffmpeg                                # cutting footage, checking frames, audio
  node: brew install node                                    # HyperFrames and Remotion renders (npx)
